name: Download FX Rates

on:
  schedule:
    # Run daily at 12:00 UTC (noon)
    - cron: '0 12 * * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FX rates download script
        run: python scripts/download_fx_rates.py

      - name: Stage downloaded files
        run: git add banks

      - name: Check for changes
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git commit -m "Update FX rates: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin main

      - name: Create email body
        if: steps.changes.outputs.has_changes == 'true'
        id: email_body
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "Daily FX rates have been successfully downloaded and committed." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "Time: $TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send notification email
        if: steps.changes.outputs.has_changes == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 'FX Rates Updated - ${{ github.run_number }}'
          to: analyst.kanishk@gmail.com
          from: 'FX Rates Bot'
          body: ${{ steps.email_body.outputs.body }}
