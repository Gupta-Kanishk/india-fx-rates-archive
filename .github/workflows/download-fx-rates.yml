name: Download FX Rates

on:
  schedule:
    # Run daily at 12:00 IST / 06:30 UTC
    - cron: '30 6 * * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FX rates download script
        run: python scripts/download_fx_rates.py

      - name: Export FX rates to CSV
        run: python scripts/export_fx_rates_to_csv.py

      - name: Upload to Neon DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not configured, skipping Neon upload."
            exit 0
          fi
          python scripts/upload_to_neon.py

      - name: Stage downloaded files
        run: git add banks

      - name: Check for changes
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git commit -m "Update FX rates: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin main

      - name: Create email body
        if: steps.changes.outputs.has_changes == 'true'
        id: email_body
        run: |
          python3 - << 'PYEOF'
          import json, os
          from pathlib import Path

          stats_file = Path("/tmp/neon_stats.json")
          stats = json.loads(stats_file.read_text()) if stats_file.exists() else {}

          bank_stats  = stats.get("bank_stats", {})
          upserted    = stats.get("upserted", "N/A")
          total_csv   = stats.get("total_csv_rows", "N/A")
          run_at      = stats.get("run_at", "N/A")
          run_url     = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          sep = "-" * 58
          lines = [
              "Daily FX Rates Update",
              "=" * 58,
              f"Time : {run_at}",
              f"Run  : {run_url}",
              "",
              "Neon DB — Bank-Level Summary:",
              sep,
              f"{'Bank':<8} {'Dates':>6}  {'Rows':>6}  {'Latest':<12}  {'Earliest'}",
              sep,
          ]
          total_db_rows = 0
          for bank, s in sorted(bank_stats.items()):
              total_db_rows += s["total_rows"]
              lines.append(
                  f"{bank:<8} {s['unique_dates']:>6}  {s['total_rows']:>6}  "
                  f"{s['latest']:<12}  {s['earliest']}"
              )
          lines += [
              sep,
              f"Total rows in DB  : {total_db_rows}",
              f"Rows upserted now : {upserted}",
              f"CSV rows          : {total_csv}",
          ]

          body = "\n".join(lines)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("body<<BODYEOF\n")
              f.write(body + "\n")
              f.write("BODYEOF\n")
          print(body)
          PYEOF

      - name: Send notification email
        if: steps.changes.outputs.has_changes == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 'FX Rates Updated - ${{ github.run_number }}'
          to: analyst.kanishk@gmail.com
          from: 'FX Rates Bot'
          body: ${{ steps.email_body.outputs.body }}
